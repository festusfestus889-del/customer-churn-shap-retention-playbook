name: Churn SHAP Pipeline
on:
  workflow_dispatch:
  schedule:
    - cron: '0 10 * * *'
jobs:
  churn:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - run: pip install -r requirements.txt
      - run: python src/generate_churn_data.py
      - run: python src/churn_model.py
      - run: python src/explainability.py
      - run: python src/retention_playbook.py
